<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>

    <button onclick="document.getElementById('result').innerHTML = amount">
        Show Quantity
    </button>

    <button onclick="amount = amount + 1;
                     document.getElementById('result').innerHTML = amount;">
        Add to Cart
    </button>

    <button onclick="amount = amount + 2;
                     document.getElementById('result').innerHTML = amount;">
        +2
    </button>

    <button onclick="amount = amount + 3;
                     document.getElementById('result').innerHTML = amount;">
        +3
    </button>

    <button onclick="amount = 0;
                     document.getElementById('result').innerHTML = amount;">
        Restart Cart
    </button>

    <h2 id="result"></h2>

<script>
    let amount = 0;
</script>

</body>
</html>
