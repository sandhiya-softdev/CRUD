<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="used">

    </div>
    

<script>

    let used = document.getElementById("used");
    fetch("https://jsonplaceholder.typicode.com/comments?postId=1")
    .then((res)=>{
        // console.log(res);
        if(res.status){
            return res.json();
        }else{
            throw Error("api consued");
            
        }
        
    })
    .then((data)=>{
        // console.log(data);

        used.innerHTML = data.map((hi)=>{

           return `<p>${hi.name}</p>
            <p>${hi.email}</p>`
        }).join("");
        
    })
</script>
</body>
</html>
