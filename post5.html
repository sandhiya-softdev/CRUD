<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="hello"></div>

    <input type="text" id="things">
    <button id="wind">button</button>


    <script>

        let hello = document.getElementById("hello");
     
        let wind = document.getElementById("wind");


        wind.addEventListener("click",(e){
              e.preventDefault();
                 let things = document.getElementById("things").value;
              fetch("https://695b727c1d8041d5eeb6c521.mockapi.io/Crud",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json" 
                },
                body:JSON.stringify({name:things})

              })
              .then((res)=>{
                return res.json();
            //   console.log(res);
              
              })
              .then((data)=>{
                hello.innerHTML= data.name;
              })
              .catch((error)=>{
                console.log(error);
              })
        })
      
        
    </script>


    
</body>
</html>
