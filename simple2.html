<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="get"></p>
    


    <script>
            let hello = document.getElementById("get");
             fetch("https://jsonplaceholder.typicode.com/users")
             .then((res)=>{
                return res.json();
             })
             .then((data)=>{
                data.forEach((user)=>{
                    hello.innerHTML+=`
                    <p>${user.name}</p>
                    <p>${user.email}</p>`;

                    
                    
                    
                });
             });

       
    </script>
</body>
</html>
