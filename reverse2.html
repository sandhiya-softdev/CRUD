<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="fname">
    <button onclick="sendData()">button</button>

    <div id="show"></div>


      <script>
        function sendData(){
        let fname = document.getElementById("fname").value;
  
        fetch("https://694fc8ca8531714d9bcef7dc.mockapi.io/crud",{

                  
            
            method:"POST",
            headers:{
                "Content-Type":"Application/json"
            },
            body:JSON.stringify({fname:fname})
        })
        .then((res)=>{
            return res.json()
        })
       .then((data) => {
  show.innerHTML = data.map(n => `<p>${n.name}</p>`).join("");
})
    }
    </script>
    
</body>
</html>
