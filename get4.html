<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>get api</title>
</head>
<body>
    <div id="hello"></div>


    <script>
        let things = document.getElementById("hello");

        fetch('https://fakestoreapi.com/products/1')
        .then((res)=>{
            // console.log(res);
            return res.json();
            
        })
        .then((data)=>{
            console.log(data);
            hello.innerText = data.title;
            
        })
    </script>
    
</body>
</html>
