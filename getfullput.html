<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="fname">
    <button ondblclick="postData()">btn</button>

    <li id="hey"></li>

    <script>
        let fname = document.getElementById("fname");
        let hey = document.getElementById("hey"); 
        function postData(){
            fetch("https://694fc8ca8531714d9bcef7dc.mockapi.io/crud",{
                method:"POST",
                headers:{
                    "Content-Type":"Application/json"
                },
                body:JSON.stringify({fname:fname.value})
            })
            .then((res)=>{
                return res.json();
            })
            .then((data)=>{
                // console.log(data);
                hey.innerHTML=data.name;
                
            })
            

        }
    </script>
    
</body>
</html>
