<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <div id="flavour">

   </div> 

   <script>
    let flavour= document.getElementById("flavour");

    fetch("https://jsonplaceholder.typicode.com/posts/1/comments")
    .then((res)=>{
          // console.log(res);


        if(res.ok){
            return res.json();
        }else{
            throw Error("api");
        }
        })
        .then((data)=>{
            // console.log(data);
          flavour.innerText =  data.forEach((n)=>{
                `<p>${n.name}</p>
                <p>${n.email}</p>`
            })
            
        });

   </script>
</body>
</html>
