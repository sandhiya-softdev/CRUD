<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="conflict"></div>

    <script>
        let determine = document.getElementById("conflict");
        fetch("https://jsonplaceholder.typicode.com/posts/1/comments")
        .then((res)=>{
            console.log(res);
            return res.json();
            
        })
        .then((data)=>{
            console.log(data);

            let hello= data.map((item)=>
                `<p>${item.name}</p>
                <p>${item.email}</p>
                `
            ).join("");

            determine.innerHTML=hello;
        });
    </script>


    
</body>
</html>
