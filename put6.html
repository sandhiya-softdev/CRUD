<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="Container"></div>
    <!-- this is we show that output -->

    <div id="update" style="display: none;">
        <input type="text" id="people">
        <button id="updateUser()">Update</button>
    </div>


    <script>
        let fan = [];
        let currentId = null;


        const Container = document.getElementById("Container");
        const people = document.getElementById("people");
        const update = document.getElementById("update");


        function HelloTimer(){
    
       fetch("https://695b727c1d8041d5eeb6c521.mockapi.io/Crud")
        .then((res)=>{
            return res.json();
        })
        .then((data)=>{
            console.log(data);
            fan = data;
            screenTimer();
            
        });
    }
        function screenTimer(){
            Container.innerHTML =fan.map(n=>
                `<p>${n.name}</p>
                <button onclick = "editUser(${n.id})">update<button>
            `).join("");
            
        }
        function editUser(id){
            const hey = fan.find(u=>u.id===id);
            currentId = id;
            people.value = hey.name;
            update.style.display = block;

        }
 function updateUser() {
  fetch(`https://695b727c1d8041d5eeb6c521.mockapi.io/Crud/${currentId}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: people.value
    })
  })
  .then(() => {
    update.style.display = "none";
    HelloTimer();
  });
}

HelloTimer();











       

        
        







    </script>
    
</body>
</html>
