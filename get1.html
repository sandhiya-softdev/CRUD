<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get method</title>
</head>
<body>
    
    <p id="get"></p>

    <script>
        let hello = document.getElementById("get");
   fetch("https://jsonplaceholder.typicode.com/users")
        .then((res)=>{
            return res.json()

        })
        .then((data)=>{
            console.log(data);
            let names = "";
            for (let i =0;i<data.length;i++){
                names+= data[i].name + ",";
                names+= data[i].email + ",";
                 names+= data[i].phone + ",";
            }
            hello.innerHTML=names;


            
            
        })

    </script>
</body>
</html>
