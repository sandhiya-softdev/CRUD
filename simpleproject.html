    <body>
        <div id="show"></div>
        <div id="showDiv"></div>
    
        

        <script>
            let empty = [];
            let show = document.getElementById("show");
            let showDiv = document.getElementById("showDiv");
            fetch("https://694fc8ca8531714d9bcef7dc.mockapi.io/CRUD")
            .then((res)=>{
                return res.json();
            })
            .then((data)=>{
                console.log(data);
                empty = data;
                empty.forEach((m)=>{
                    show.innerHTML+=`<li>${m.name}</li>`

                });
                let hey=empty.find((m)=>
                    m.email==="Maurine32@hotmail.com"
                );
                showDiv.innerHTML=`<p>${hey.email}</p>`
                


                

            })
        </script>
