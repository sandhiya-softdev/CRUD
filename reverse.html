<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="hello"></div>
    

    <script>
        let hello = document.getElementById("hello");
        fetch('https://jsonplaceholder.typicode.com/posts/1')
        .then((res)=>{
            return res.json();
        })
        .then((data)=>{
            console.log(data);
            hello.innerHTML = data.title;
            
        })
    </script>
</body>
</html>
